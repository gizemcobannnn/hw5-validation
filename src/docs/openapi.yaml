# /docs/openapi.yaml
openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    This is a documentation of contacts app
tags:
  - name: Contacts
    description: Operations about contacts.
servers:
  - url: http://localhost:3000
paths:
  /contacts:
    get:
      security:
        - bearerAuth: []
      tags:
        - Contacts
      $ref: ../swagger/paths/contacts/get.yaml 
    post:
      security:
        - bearerAuth: []
      tags:
        - Contacts
      $ref: ../swagger/paths/contacts/post.yaml 
  /contacts/{id}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Contacts
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      security:
        - bearerAuth: []
      tags:
        - Contacts
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      security:
        - bearerAuth: []
      tags:
        - Contacts
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

